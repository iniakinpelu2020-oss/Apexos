name: Bundle Apex

# Clones every frontend Apex repo into one static tree (dist/) and ships it to
# Cloudflare Pages, so every app lives on a single origin at /apps/<slug>/ and
# can share one service-worker cache. This repo is the shell at the root of
# dist/; the app repos are mounted underneath it.
#
# The cloning, gating and deploying steps live in .github/scripts/ so the
# workflow log stays short enough to actually read the error at the end.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bundle-apex-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APEX_OWNER: iniakinpelu2020-oss
  # Must match the Cloudflare Pages project that serves apexoperatingsystem.pages.dev.
  PAGES_PROJECT: apexoperatingsystem

jobs:
  bundle:
    name: Bundle frontend apps and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout ApexOS into dist/
        uses: actions/checkout@v4
        with:
          path: dist
          clean: true
          persist-credentials: false

      - name: Strip VCS metadata from the shell
        run: |
          set -euo pipefail
          # The whole repo is checked out into dist/, so these scripts live there
          # too. Copy them out of dist/ before its .github is deleted, and keep
          # them outside the deployed tree.
          mkdir -p .bundle
          cp -r dist/.github/scripts .bundle/scripts
          chmod +x .bundle/scripts/*.sh
          rm -rf dist/.git dist/.github
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/registry.js
          test -f dist/sw.js

      - name: Clone every frontend app into dist/apps/<slug>/
        env:
          APEX_REPOS_TOKEN: ${{ secrets.APEX_REPOS_TOKEN }}
        run: bash .bundle/scripts/bundle.sh

      - name: Gate every bundled app behind the Apex sign-in
        run: python3 .bundle/scripts/gate.py

      - name: Verify the bundle
        run: |
          set -euo pipefail
          du -sh dist
          for slug in ai studio editor browser search notrack docs notes planner drop gallery \
                      camera voice video archive links backup vault shield sec auth ledger feed pulse \
                      automation store settings; do
            if [ -d "dist/apps/${slug}" ]; then
              echo "ok   /apps/${slug}/"
            else
              echo "::error::/apps/${slug}/ is missing from the bundle"
              exit 1
            fi
          done

      - name: Deploy dist/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .bundle/scripts/deploy.sh
