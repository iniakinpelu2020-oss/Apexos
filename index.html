<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d17">
<meta name="description" content="ApexOS - your private app suite, bundled on one origin and usable offline.">
<title>ApexOS</title>
<script src="./apex-login.js"></script>
<link rel="stylesheet" href="./styles.css">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body data-layout="desktop" data-wall="aurora">
<div class="bg" aria-hidden="true"></div>

<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true">A</span><span class="word">Apex<b>OS</b></span></div>
  <div class="bar-right">
    <span class="chip" id="netChip" title="Connection">Online</span>
    <time class="clock" id="clock">--:--</time>
    <div class="power">
      <button class="power-btn" id="powerBtn" type="button" aria-haspopup="true" aria-expanded="false"
              aria-controls="powerMenu" title="Power">
        <span aria-hidden="true">&#9211;</span><span class="sr-only">Power menu</span>
      </button>
      <div class="power-menu" id="powerMenu" role="menu" aria-label="Power" hidden>
        <button class="power-item" id="apexAccount" type="button" role="menuitem" data-apex-signout title="Sign out of Apex">
          <span class="power-name" data-apex-account>Signed in</span>
          <span class="power-note">Signed in &middot; tap to sign out</span>
        </button>
        <button class="power-item" id="restartOs" type="button" role="menuitem">
          <span class="power-name">Restart OS</span>
          <span class="power-note">Fetch the latest build and reload</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="stage" id="stage">
  <h1 class="sr-only">Installed apps</h1>
  <div class="grid" id="desktopGrid"></div>
  <p class="empty" id="desktopEmpty" hidden>
    Nothing installed yet. Open <a href="/apps/store/">Apex Store</a> and install a few apps.
  </p>
</main>

<nav class="dock" aria-label="ApexOS dock">
  <button class="dock-btn" id="drawerBtn" type="button" aria-expanded="false">
    <span class="dock-glyph" aria-hidden="true">&#9638;</span>Apps
  </button>
  <a class="dock-btn" href="/apps/store/" data-app="store"><span class="dock-glyph" aria-hidden="true">&#9670;</span>Store</a>
  <a class="dock-btn" href="/apps/settings/" data-app="settings"><span class="dock-glyph" aria-hidden="true">&#9881;</span>Settings</a>
</nav>

<div class="sheet" id="drawer" hidden>
  <div class="sheet-head">
    <span>App drawer</span>
    <button class="sheet-done" id="drawerDone" type="button">Done</button>
  </div>
  <div class="grid grid-drawer" id="drawerGrid"></div>
  <p class="sheet-foot" id="drawerCount"></p>
</div>

<div class="window" id="appWindow" hidden>
  <div class="window-head">
    <span class="window-title" id="windowTitle">App</span>
    <div class="window-tools">
      <a class="window-btn" id="windowOpen" href="/apps/store/" target="_blank" rel="noopener noreferrer">Open in tab</a>
      <button class="window-btn" id="windowClose" type="button">Close</button>
    </div>
  </div>
  <iframe
    class="window-frame"
    id="appFrame"
    title="App window"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"
    referrerpolicy="no-referrer"></iframe>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="./registry.js"></script>
<script src="./app.js"></script>
</body>
</html>
